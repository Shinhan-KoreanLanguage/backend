spring:
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        max-page-size: ${PAGE_MAX_SIZE:100} # 클라이언트가 요청 가능한 최대 페이지 사이즈
        default-page-size: ${PAGE_DEFAULT_SIZE:20} # 기본 페이지 사이즈

  # 파일 업로드(multipart) 요청 크기 제한
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}      # 파일 1개 최대 크기
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:100MB}  # 요청 전체 최대 크기

  # JSON → enum 변환 시 대소문자 무시 (예: "kr" → KR) — 회원가입/프로필수정 일관 처리
  jackson:
    mapper:
      accept-case-insensitive-enums: ${JACKSON_CASE_INSENSITIVE_ENUMS:true}

custom:
  # AI 분석 서버 (FastAPI)
  # 사용자 음성·영상이 전송되는 곳이라 팀 서버 주소를 기본값으로 두지 않는다.
  # 환경변수 미설정 시 로컬로 붙어 실패하므로, 각자 .env에 AI_SERVER_URL을 지정할 것
  ai:
    base-url: ${AI_SERVER_URL:http://localhost:8000}

  # 업로드 파일은 NCP Object Storage에 저장한다 (아래 ncp.storage 참고).
  # 아래 두 값은 앱이 직접 서빙하는 파일용으로 남겨둔다
  file:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}                # Object Storage 전환 이전에 저장된 파일 조회용
    # 프로필 미설정 시 기본 이미지. jar에 포함되어 앱이 직접 서빙하므로 서버 주소를 따라간다.
    # 배포 시 APP_BASE_URL을 지정하지 않으면 프론트가 로드할 수 없는 localhost 주소가 내려간다
    default-profile-image: ${APP_BASE_URL:http://localhost:8080}/images/default-profile.png

  # NCP Object Storage (S3 호환)
  ncp:
    storage:
      region: ${NCP_STORAGE_REGION:kr-standard}
      endpoint: ${NCP_STORAGE_ENDPOINT:https://kr.object.ncloudstorage.com}
      bucket: ${NCP_STORAGE_BUCKET}
      access-key: ${NCP_STORAGE_ACCESS_KEY}
      secret-key: ${NCP_STORAGE_SECRET_KEY}

  # JWT 설정
  jwt:
    secret-key: ${JWT_SECRET}
    access-exp-min: ${JWT_ACCESS_EXP_MIN:60} # 토큰 유효시간 : 60분
    refresh-exp-day: ${JWT_REFRESH_EXP_DAY:30} # RT 유효시간 : 30일

  # 소셜 로그인 설정 (구글, 페이스북 — OAuthProperties가 이 블록을 읽음)
  oauth2:
    registration:
      google:
        client-id: ${GOOGLE_CLIENT_ID}
        client-secret: ${GOOGLE_CLIENT_SECRET}
        redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/oauth/callback/google}
      facebook:
        client-id: ${FACEBOOK_CLIENT_ID}
        client-secret: ${FACEBOOK_CLIENT_SECRET}
        redirect-uri: ${FACEBOOK_REDIRECT_URI:http://localhost:3000/oauth/callback/facebook}

# Swagger 설정
springdoc:
  swagger-ui:
    path: ${SWAGGER_UI_PATH:/swagger-ui.html}
    tags-sorter: ${SWAGGER_TAGS_SORTER:alpha} # API 그룹 알파벳 순으로 정렬
    operations-sorter: ${SWAGGER_OPERATIONS_SORTER:alpha} # 각 그룹 안의 API를 알파벳 순으로 정렬
  api-docs:
    default-consumes-media-type: ${SWAGGER_DEFAULT_CONSUMES:application/json} # 요청 기본 타입을 JSON으로 설정
    default-produces-media-type: ${SWAGGER_DEFAULT_PRODUCES:application/json} # 응답 기본 타입을 JSON으로 설정