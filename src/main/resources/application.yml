spring:
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  # 파일 업로드(multipart) 요청 크기 제한
  servlet:
    multipart:
      max-file-size: 5MB      # 파일 1개 최대 크기
      max-request-size: 10MB  # 요청 전체 최대 크기

  # JSON → enum 변환 시 대소문자 무시 (예: "kr" → KR) — 회원가입/프로필수정 일관 처리
  jackson:
    mapper:
      accept-case-insensitive-enums: true

custom:
  # 파일 저장 설정 (현재 로컬 스토리지, 추후 S3로 교체 예정)
  file:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}                # 로컬 저장 루트 폴더 (앱 실행 위치 기준 상대경로)
    url-prefix: ${FILE_URL_PREFIX:http://localhost:8080/images}  # 저장된 파일에 접근할 URL 앞부분
    default-profile-image: ${DEFAULT_PROFILE_IMAGE_URL:http://localhost:8080/images/default-profile.png} # 프로필 미설정 시 기본 이미지

  # JWT 설정
  jwt:
    secret-key: ${JWT_SECRET}
    access-exp-min: ${JWT_ACCESS_EXP_MIN:60} # 토큰 유효시간 : 60분
    refresh-exp-day: ${JWT_REFRESH_EXP_DAY:30} # RT 유효시간 : 30일

  # 소셜 로그인 설정 (구글, 페이스북 — OAuthProperties가 이 블록을 읽음)
  oauth2:
    registration:
      google:
        client-id: ${GOOGLE_CLIENT_ID}
        client-secret: ${GOOGLE_CLIENT_SECRET}
        redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/oauth/callback/google}
      facebook:
        client-id: ${FACEBOOK_CLIENT_ID}
        client-secret: ${FACEBOOK_CLIENT_SECRET}
        redirect-uri: ${FACEBOOK_REDIRECT_URI:http://localhost:3000/oauth/callback/facebook}

# Swagger 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha # API 그룹 알파벳 순으로 정렬
    operations-sorter: alpha # 각 그룹 안의 API를 알파벳 순으로 정렬
  api-docs:
    default-consumes-media-type: application/json # 요청 기본 타입을 JSON으로 설정
    default-produces-media-type: application/json # 응답 기본 타입을 JSON으로 설정